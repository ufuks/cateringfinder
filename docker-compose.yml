services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catefind
      POSTGRES_PASSWORD: catefind
      POSTGRES_DB: catefind
    ports: ["5432:5432"]
    volumes: ["catefind_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  catefind_pg:
